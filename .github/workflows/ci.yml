name: Python CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            python/requirements-core.txt
            python/requirements-dev.txt
      - name: Install test dependencies
        working-directory: python
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff
        working-directory: python
        run: python -m ruff check .
      - name: Tests and coverage
        working-directory: python
        run: python -m pytest tests -q --cov --cov-report=term-missing --cov-fail-under=70
      - name: Bytecode compilation
        working-directory: python
        run: python -m compileall -q agents api config orchestrator services utils mcp_server.py

  storage-integration:
    name: Qdrant + Neo4j integration
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
        options: >-
          --health-cmd "bash -c ': > /dev/tcp/127.0.0.1/6333'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      neo4j:
        image: neo4j:community
        ports:
          - 7687:7687
        env:
          NEO4J_AUTH: neo4j/password
        options: >-
          --health-cmd "neo4j status"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/requirements-dev.txt
      - name: Install test dependencies
        working-directory: python
        run: python -m pip install -r requirements-dev.txt
      - name: Real storage roundtrip
        working-directory: python
        env:
          RUN_DOCKER_E2E: "1"
          VECTOR_STORE_TYPE: qdrant
          QDRANT_URL: http://localhost:6333
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: password
        run: python -m pytest tests/test_live_stores.py -q
